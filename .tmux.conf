set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g history-limit 50000

# Prefer vi-style keys in the status line prompt and copy-mode
set -g status-keys vi
setw -g mode-keys vi

# Vi-style copy-mode extras
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Use Tab as an additional prefix key (double Tab still inserts a literal Tab)
unbind Tab
bind -n Tab switch-client -T prefix
bind -T prefix Tab send-keys Tab
